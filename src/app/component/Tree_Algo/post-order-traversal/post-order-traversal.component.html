<div class="background-container">
  <div class="content-container">
    <div class="flex flex-col items-center justify-center m-5">
      <span class="animate-slide-in">Postorder Traversal</span>
      <hr class="w-full" />
    </div>

    <div class="tree-container">
      <div class="tree">
        <ul>
          <li>
            <div
              class="node"
              [ngClass]="{ 'active-node': activeNode === treeNodes[0].value }"
            >
              {{ treeNodes[0].value }}
            </div>
            <ul>
              <li>
                <div
                  class="node"
                  [ngClass]="{ 'active-node': activeNode === treeNodes[1].value }"
                >
                  {{ treeNodes[1].value }}
                </div>
                <ul>
                  <li>
                    <div
                      class="node"
                      [ngClass]="{
                        'active-node': activeNode === treeNodes[3].value
                      }"
                    >
                      {{ treeNodes[3].value }}
                    </div>
                  </li>
                  <li>
                    <div
                      class="node"
                      [ngClass]="{
                        'active-node': activeNode === treeNodes[4].value
                      }"
                    >
                      {{ treeNodes[4].value }}
                    </div>
                  </li>
                </ul>
              </li>
              <li>
                <div
                  class="node"
                  [ngClass]="{ 'active-node': activeNode === treeNodes[2].value }"
                >
                  {{ treeNodes[2].value }}
                </div>
                <ul>
                  <li>
                    <div
                      class="node"
                      [ngClass]="{
                        'active-node': activeNode === treeNodes[5].value
                      }"
                    >
                      {{ treeNodes[5].value }}
                    </div>
                  </li>
                  <li>
                    <div
                      class="node"
                      [ngClass]="{
                        'active-node': activeNode === treeNodes[6].value
                      }"
                    >
                      {{ treeNodes[6].value }}
                    </div>
                  </li>
                </ul>
              </li>
            </ul>
          </li>
        </ul>
      </div>
    </div>

    <div class="controls mt-4 text-center">
      <button type="button" (click)="postOrderTraversal(treeNodes[0])">
        Start Postorder Traversal
      </button>
      <button type="button" (click)="resetTree()">Reset Tree</button>
    </div>
  </div>
</div>
