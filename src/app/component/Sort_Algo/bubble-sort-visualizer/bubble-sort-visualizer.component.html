<div class="background-container">
  <div class="content-container">
    <div class="flex flex-col items-center justify-center m-5">
      <span class="animate-slide-in font-bold font-sans text-white">
        Bubble Sort
      </span>
      <hr class="border-b border-gray-700 w-full ml-2" />
    </div>
    <div class="array-container">
      <div
        *ngFor="let bar of array; let i = index"
        class="array-bar"
        [style.height]="bar + 'px'"
        [ngClass]="{ 'active-bar': activeIndexes.has(i) }"
      ></div>
    </div>
    <div class="controls-panel">
      <div class="controls-row">
        <button (click)="bubbleSort()">Start Sorting</button>
        <button (click)="resetArray()">Generate New Array</button>
        <button (click)="stopSorting()" [disabled]="!isSorting">
          Stop Sorting
        </button>
      </div>
      <div class="controls-row controls-row-sliders">
        <label class="control-field">
          <span class="control-field-head"><span>Speed</span><span>{{ speedFactor }}x</span></span>
          <input
            type="range"
            min="0.5"
            max="4"
            step="0.5"
            [value]="speedFactor"
            (input)="onSpeedChange($event)"
          />
        </label>
        <label class="control-field">
          <span class="control-field-head"><span>Array Size</span><span>{{ arraySize }}</span></span>
          <input
            type="range"
            min="20"
            max="170"
            step="5"
            [value]="arraySize"
            [disabled]="isSorting"
            (input)="onArraySizeChange($event)"
          />
        </label>
      </div>
    </div>
  </div>
</div>
