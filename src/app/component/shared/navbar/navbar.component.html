<nav class="nav-shell" role="navigation" aria-label="Algorithm navigation">
  <div class="brand-block">
    <h1 class="brand-title">AlgoScope</h1>
    <p class="brand-subtitle">Interactive Algorithm Visualizer</p>
  </div>

  <button
    type="button"
    class="menu-toggle"
    (click)="toggleMobileMenu()"
    aria-label="Toggle navigation menu"
  >
    {{ mobileMenuOpen ? 'Close' : 'Menu' }}
  </button>

  <div class="nav-actions" [class.nav-actions-open]="mobileMenuOpen">
    <ul class="menu-list">
      <li class="menu-item" *ngFor="let menu of navMenus">
        <button
          type="button"
          class="menu-trigger"
          (click)="toggleDropdown(menu.key)"
        >
          {{ menu.label }}
        </button>
        <ul class="dropdown" *ngIf="dropdownStates[menu.key]">
          <li *ngFor="let item of menu.items">
            <a
              [routerLink]="item.route"
              class="dropdown-link"
              (click)="closeMenus()"
            >
              {{ item.label }}
            </a>
          </li>
        </ul>
      </li>
    </ul>

    <button type="button" class="theme-toggle" (click)="toggleTheme()">
      <span>{{ isDarkMode ? 'Light' : 'Dark' }}</span>
      <span>Theme</span>
    </button>
  </div>
</nav>
