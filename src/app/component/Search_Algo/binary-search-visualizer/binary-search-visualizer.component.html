<div class="background-container">
  <div class="content-container">
    <!-- Title Section -->
    <div class="flex flex-col items-center justify-center m-5">
      <span class="animate-slide-in">Binary Search</span>
      <hr class="border-b border-gray-700 w-full ml-2" />
    </div>

    <!-- Array Visualization -->
    <div class="array-container">
      <div
        *ngFor="let bar of array; let i = index"
        class="array-bar"
        [style.height]="bar + 'px'"
        [ngClass]="{
          'active-bar': activeIndexes.has(i),
          'mid-bar': midIndex === i,
          'found-bar': foundIndex === i
        }"
      ></div>
    </div>

    <!-- Action Buttons -->
    <div class="controls-panel">
      <div class="controls-row">
        <button (click)="startBinarySearch()" [disabled]="isSearching">
          Start Binary Search
        </button>
        <button (click)="resetArray()" [disabled]="isSearching">
          Generate New Array
        </button>
        <button *ngIf="isSearching" (click)="cancelSearch()">
          Cancel Search
        </button>
      </div>
      <div class="controls-row controls-row-sliders">
        <label class="control-field">
          <span class="control-field-head"><span>Speed</span><span>{{ speedFactor }}x</span></span>
          <input
            type="range"
            min="0.5"
            max="4"
            step="0.5"
            [value]="speedFactor"
            (input)="onSpeedChange($event)"
          />
        </label>
        <label class="control-field">
          <span class="control-field-head"><span>Array Size</span><span>{{ arraySize }}</span></span>
          <input
            type="range"
            min="20"
            max="170"
            step="5"
            [value]="arraySize"
            [disabled]="isSearching"
            (input)="onArraySizeChange($event)"
          />
        </label>
      </div>
    </div>

    <!-- Search Information -->
    <div *ngIf="targetValue !== null" class="mt-2">
      <span class="font-bold font-mono">
        Searching for value: {{ targetValue }}
      </span>
      <span class="font-bold font-mono ml-2">
        Found Index: {{ foundIndex }}
      </span>
    </div>
  </div>
</div>
